<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .service-button {
            display: flex;
            align-items: center;
            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;
            padding: 6px 10px;

            border: 1px solid #d2d9e5;
            border-radius: 22px;
            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                6px 8px 18px rgba(35, 55, 85, 0.14),
                -4px -4px 12px rgba(255, 255, 255, 0.98);

            overflow: hidden;
            transition:
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .service-button:hover {
            box-shadow:
                8px 10px 22px rgba(35, 55, 85, 0.18),
                -4px -4px 12px rgba(255, 255, 255, 0.98);
        }

        .service-button:active,
        .service-button:focus {
            outline: none;
        }

        .service-logo-area {
            width: 135px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
        }

        .bidcars-logo {
            width: 105px;
            height: 52px;
            border-radius: 0;
        }

        .searates-logo {
            width: 112px;
            height: 48px;
            border-radius: 0;
        }

        .service-divider {
            width: 2px;
            height: 42px;
            margin: 0 10px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .service-text {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.15;
        }

        .service-text span {
            display: block;
        }

        .service-arrow {
            width: 20px;
            margin-left: 6px;
            flex-shrink: 0;

            font-size: 30px;
            font-weight: 400;
            color: #172033;
            text-align: center;
        }

        @media (max-width: 420px) {
            .service-button {
                width: 72%;
                height: 64px;
                padding: 6px 8px;
            }

            .service-logo-area {
                width: 135px;
            }

            .service-logo {
                width: 48px;
                height: 48px;
            }

            .bidcars-logo {
                width: 105px;
                height: 52px;
            }

            .searates-logo {
                width: 112px;
                height: 48px;
            }

            .service-divider {
                height: 42px;
                margin: 0 8px;
            }

            .service-text {
                font-size: 15px;
            }

            .service-arrow {
                font-size: 30px;
                margin-left: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">

        <!-- Transportation Price -->
        <a
            class="service-button"
            href="transportationPrice.html"
        >
            <div class="service-logo-area">
                <img
                    class="service-logo"
                    src="caucasus-logo.jpeg"
                    alt="Caucasus Auto Import"
                >
            </div>

            <div class="service-divider"></div>

            <div class="service-text">
                <span>Transportation</span>
                <span>Price</span>
            </div>

            <div class="service-arrow">›</div>
        </a>

        <!-- BidCars -->
        <a
            class="service-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <div class="service-logo-area">
                <img
                    class="service-logo bidcars-logo"
                    src="bidcars-logo.jpeg"
                    alt="BidCars"
                >
            </div>

            <div class="service-divider"></div>

            <div class="service-text">
                <span>BidCars</span>
            </div>

            <div class="service-arrow">›</div>
        </a>

        <!-- SeaRates -->
        <a
            class="service-button"
            href="https://www.searates.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <div class="service-logo-area">
                <img
                    class="service-logo searates-logo"
                    src="searates-logo.jpeg"
                    alt="SeaRates"
                >
            </div>

            <div class="service-divider"></div>

            <div class="service-text">
                <span>SeaRates</span>
            </div>

            <div class="service-arrow">›</div>
        </a>

    </div>

</body>
</html>
