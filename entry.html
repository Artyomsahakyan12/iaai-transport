
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 46%;
            max-width: 360px;
            min-width: 220px;
            height: 64px;

            border-radius: 22px;
            background: #2864e8;
            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;

            transition: background 0.15s ease;
        }

        .tool-button:hover {
            background: #1d4ed8;
        }

        .tool-button:active,
        .tool-button:focus {
            outline: none;
        }

        @media (max-width: 420px) {
            .tool-button {
                width: 72%;
                min-width: 0;
            }
        }

        .site-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
        }

        .site-frame {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .close-button {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 10000;

            width: 44px;
            height: 44px;

            border: 0;
            border-radius: 50%;
            background: #ffffff;
            color: #111827;

            font-size: 30px;
            line-height: 44px;
            text-align: center;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="buttons">

        <a class="tool-button" href="transportationPrice.html">
            Transportation Price
        </a>

        <a
            class="tool-button"
            href="https://bid.cars/en/"
            id="open-bidcars"
        >
            BidCars
        </a>

        <a
            class="tool-button"
            href="https://www.searates.com/"
            id="open-searates"
        >
            SeaRates
        </a>

    </div>

    <!-- BidCars iframe -->
    <div id="bidcars-screen" class="site-screen">

        <button
            id="close-bidcars"
            class="close-button"
            type="button"
            aria-label="Back to home"
        >
            ×
        </button>

        <iframe
            id="bidcars-frame"
            class="site-frame"
            src="about:blank"
            title="BidCars"
        ></iframe>

    </div>

    <!-- SeaRates iframe -->
    <div id="searates-screen" class="site-screen">

        <button
            id="close-searates"
            class="close-button"
            type="button"
            aria-label="Back to home"
        >
            ×
        </button>

        <iframe
            id="searates-frame"
            class="site-frame"
            src="about:blank"
            title="SeaRates"
        ></iframe>

    </div>

    <script>
        const openBidCars = document.getElementById('open-bidcars');
        const closeBidCars = document.getElementById('close-bidcars');
        const bidCarsScreen = document.getElementById('bidcars-screen');
        const bidCarsFrame = document.getElementById('bidcars-frame');

        const openSeaRates = document.getElementById('open-searates');
        const closeSeaRates = document.getElementById('close-searates');
        const seaRatesScreen = document.getElementById('searates-screen');
        const seaRatesFrame = document.getElementById('searates-frame');

        openBidCars.addEventListener('click', function (event) {
            event.preventDefault();

            bidCarsFrame.src = 'https://bid.cars/en/';
            bidCarsScreen.style.display = 'block';
        });

        closeBidCars.addEventListener('click', function () {
            bidCarsScreen.style.display = 'none';
            bidCarsFrame.src = 'about:blank';
        });

        openSeaRates.addEventListener('click', function (event) {
            event.preventDefault();

            seaRatesFrame.src = 'https://www.searates.com/';
            seaRatesScreen.style.display = 'block';
        });

        closeSeaRates.addEventListener('click', function () {
            seaRatesScreen.style.display = 'none';
            seaRatesFrame.src = 'about:blank';
        });
    </script>

</body>
</html>
