<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 46%;
            max-width: 360px;
            min-width: 220px;
            height: 64px;

            border-radius: 22px;
            background: #2864e8;
            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;

            transition: background 0.15s ease;
        }

        .tool-button:hover {
            background: #1d4ed8;
        }

        .tool-button:active,
        .tool-button:focus {
            outline: none;
        }

        @media (max-width: 420px) {
            .tool-button {
                width: 72%;
                min-width: 0;
            }
        }
        
        .transport-button {
    display: flex;
    align-items: center;
    width: 85%;
    max-width: 620px;
    min-height: 150px;
    padding: 18px 28px;
    border-radius: 32px;
    background: #ffffff;
    color: #172033;
    text-decoration: none;
    box-shadow:
        10px 10px 25px rgba(35, 55, 85, 0.10),
        -8px -8px 20px rgba(255, 255, 255, 0.95);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.transport-button:hover {
    transform: translateY(-3px);
    box-shadow:
        12px 14px 30px rgba(35, 55, 85, 0.16),
        -8px -8px 20px rgba(255, 255, 255, 1);
}

.transport-logo {
    width: 112px;
    height: 112px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: contain;
}

.transport-divider {
    width: 2px;
    height: 92px;
    margin: 0 30px;
    background: #d9e0e9;
}

.transport-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.25;
}

.transport-arrow {
    margin-left: 22px;
    font-size: 48px;
    font-weight: 300;
    color: #172033;
}

@media (max-width: 520px) {
    .transport-button {
        width: 94%;
        min-height: 112px;
        padding: 14px;
        border-radius: 24px;
    }

    .transport-logo {
        width: 78px;
        height: 78px;
    }

    .transport-divider {
        height: 65px;
        margin: 0 14px;
    }

    .transport-text {
        font-size: 19px;
    }

    .transport-arrow {
        margin-left: 10px;
        font-size: 34px;
    }
}
        
    </style>
</head>

<body>

    <div class="buttons">

      <a class="transport-button" href="transportationPrice.html">
    <img
        class="transport-logo"
        src="caucasus-logo.jpeg"
        alt="Caucasus Auto Import"
    >

    <div class="transport-divider"></div>

    <div class="transport-text">
        <span>Transportation</span>
        <span>Price</span>
    </div>

    <div class="transport-arrow">›</div>
</a>

        <a
            class="tool-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >
            BidCars
        </a>

        <a
            class="tool-button"
            href="https://www.searates.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            SeaRates
        </a>

    </div>

</body>
</html>
