<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 72%;
            max-width: 540px;
            min-width: 220px;
            height: 115px;

            border: 1px solid #d2dae7;
            border-radius: 28px;
            background: #ffffff;
            color: #172033;

            font-size: 28px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;

            box-shadow:
                8px 8px 20px rgba(35, 55, 85, 0.14),
                -6px -6px 16px rgba(255, 255, 255, 0.95);

            transition: background 0.15s ease;
        }

        .tool-button:hover {
            background: #f8faff;
        }

        .tool-button:active,
        .tool-button:focus {
            outline: none;
        }

        /* Ընդհանուր կառուցվածք Transportation և BidCars կոճակների համար */
        .brand-button {
            display: flex;
            align-items: center;
            box-sizing: border-box;

            width: 72%;
            max-width: 540px;
            height: 115px;

            padding: 10px 16px;
            border: 1px solid #d2dae7;
            border-radius: 28px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                8px 8px 20px rgba(35, 55, 85, 0.14),
                -6px -6px 16px rgba(255, 255, 255, 0.95);

            overflow: hidden;
        }

        /* Լոգոյի համար հաստատուն լայնություն,
           որպեսզի երկու բաժանարար գծերը նույն դիրքում լինեն */
        .brand-logo-area {
            width: 220px;
            height: 100%;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transport-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .bidcars-logo {
            width: 150px;
            height: 95px;
            object-fit: contain;
        }

        .brand-divider {
            width: 2px;
            height: 82px;
            margin: 0 18px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .brand-text {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-text span {
            display: block;
        }

        .brand-arrow {
            margin-left: 10px;
            flex-shrink: 0;
            font-size: 42px;
            color: #172033;
        }

        @media (max-width: 520px) {
            .buttons {
                gap: 18px;
                padding: 20px 0;
            }

            .brand-button,
            .tool-button {
                width: 72%;
                min-width: 0;
            }

            .brand-button {
                height: 115px;
                padding: 10px;
            }

            .brand-logo-area {
                width: 125px;
            }

            .transport-logo {
                width: 76px;
                height: 76px;
            }

            .bidcars-logo {
                width: 112px;
                height: 78px;
            }

            .brand-divider {
                height: 82px;
                margin: 0 10px;
            }

            .brand-text {
                font-size: 23px;
            }

            .brand-arrow {
                font-size: 38px;
                margin-left: 6px;
            }

            .tool-button {
                height: 115px;
                border-radius: 28px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">

        <!-- Transportation Price -->
        <a class="brand-button" href="transportationPrice.html">

            <div class="brand-logo-area">
                <img
                    class="transport-logo"
                    src="caucasus-logo.jpeg"
                    alt="Caucasus Auto Import"
                >
            </div>

            <div class="brand-divider"></div>

            <div class="brand-text">
                <span>Transportation</span>
                <span>Price</span>
            </div>

            <div class="brand-arrow">›</div>

        </a>

        <!-- BidCars -->
        <a
            class="brand-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="brand-logo-area">
                <img
                    class="bidcars-logo"
                    src="bidcars-logo.jpeg"
                    alt="BidCars"
                >
            </div>

            <div class="brand-divider"></div>

            <div class="brand-text">
                <span>BidCars</span>
            </div>

            <div class="brand-arrow">›</div>

        </a>

        <!-- SeaRates -->
        <a
            class="tool-button"
            href="https://www.searates.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            SeaRates
        </a>

    </div>

</body>
</html>
