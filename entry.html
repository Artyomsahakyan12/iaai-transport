<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;

            border-radius: 22px;
            background: #2864e8;
            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;

            transition: background 0.15s ease;
        }

        .tool-button:hover {
            background: #1d4ed8;
        }

        .tool-button:active,
        .tool-button:focus {
            outline: none;
        }

        /* Ընդհանուր սպիտակ կոճակներ */
        .brand-button {
            display: flex;
            align-items: center;
            justify-content: flex-start;

            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;

            padding: 6px 10px;
            border: 1px solid rgba(190, 201, 218, 0.85);
            border-radius: 22px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                0 2px 4px rgba(35, 55, 85, 0.08),
                0 8px 18px rgba(35, 55, 85, 0.14),
                0 0 0 1px rgba(255, 255, 255, 0.95) inset,
                -4px -4px 12px rgba(255, 255, 255, 0.95);

            overflow: hidden;

            transition:
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        .brand-button:hover {
            box-shadow:
                0 3px 5px rgba(35, 55, 85, 0.10),
                0 10px 22px rgba(35, 55, 85, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.95) inset,
                -4px -4px 12px rgba(255, 255, 255, 0.95);
        }

        .brand-button:active {
            transform: scale(0.99);
        }

        /* Լոգոյի համար ֆիքսված տարածք՝ գծերը հավասարեցնելու համար */
        .brand-logo-box {
            width: 112px;
            height: 52px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .caucasus-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .bidcars-logo {
            width: 104px;
            height: 48px;
        }

        .brand-divider {
            width: 2px;
            height: 42px;
            margin: 0 12px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .brand-text {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.15;
        }

        .brand-text span {
            display: block;
        }

        .brand-arrow {
            width: 18px;
            flex-shrink: 0;

            margin-left: 8px;
            font-size: 30px;
            color: #172033;
            text-align: center;
        }

        @media (max-width: 420px) {
            .brand-button,
            .tool-button {
                width: 72%;
            }

            .brand-button {
                height: 64px;
                padding: 6px 10px;
            }

            .brand-logo-box {
                width: 112px;
                height: 52px;
            }

            .brand-divider {
                height: 42px;
                margin: 0 10px;
            }

            .brand-text {
                font-size: 15px;
            }

            .brand-arrow {
                font-size: 30px;
                margin-left: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">

        <!-- Transportation Price -->
        <a
            class="brand-button"
            href="transportationPrice.html"
        >
            <div class="brand-logo-box">
                <img
                    class="brand-logo caucasus-logo"
                    src="caucasus-logo.jpeg"
                    alt="Caucasus Auto Import"
                >
            </div>

            <div class="brand-divider"></div>

            <div class="brand-text">
                <span>Transportation</span>
                <span>Price</span>
            </div>

            <div class="brand-arrow">›</div>
        </a>

        <!-- BidCars -->
        <a
            class="brand-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <div class="brand-logo-box">
                <img
                    class="brand-logo bidcars-logo"
                    src="bidcars-logo.jpeg"
                    alt="BidCars"
                >
            </div>

            <div class="brand-divider"></div>

            <div class="brand-text">
                <span>BidCars</span>
            </div>

            <div class="brand-arrow">›</div>
        </a>

        <!-- SeaRates -->
        <a
            class="tool-button"
            href="https://www.searates.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            SeaRates
        </a>

    </div>

</body>
</html>
