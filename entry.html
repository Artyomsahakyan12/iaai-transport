
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PulseAutoImport</title>
    <meta name="apple-mobile-web-app-title" content="PulseAutoImport">

    <!-- iOS Home Screen Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#172033">

    <link rel="apple-touch-icon" href="./pulseAutoImport-appIcon.PNG">
    <link rel="manifest" href="./manifest.json">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        body.modal-open {
            overflow: hidden;
        }

        .brand-logo {
            width: 260px;
            max-width: 70%;
            height: auto;
            margin-bottom: 55px;
            object-fit: contain;
        }

        .buttons {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .tool-button {
            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            transition:
                background 0.15s ease,
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        .tool-button:hover {
            background: #1d4ed8;
        }

        .tool-button:active {
            transform: scale(0.99);
        }

        .tool-button:focus {
            outline: none;
        }

        .transport-button,
        .bidcars-button,
        .caucasusContainerTracking-button {
            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;
            padding: 6px 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
            border: 1px solid rgba(190, 201, 218, 0.75);
            border-radius: 22px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                0 2px 4px rgba(35, 55, 85, 0.08),
                0 8px 18px rgba(35, 55, 85, 0.14),
                0 0 0 1px rgba(255, 255, 255, 0.95) inset,
                -4px -4px 12px rgba(255, 255, 255, 0.95);

            overflow: hidden;

            transition:
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        .transport-button {
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .transport-button:hover,
        .bidcars-button:hover,
        .caucasusContainerTracking-button:hover {
            box-shadow:
                0 3px 5px rgba(35, 55, 85, 0.10),
                0 10px 22px rgba(35, 55, 85, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.95) inset,
                -4px -4px 12px rgba(255, 255, 255, 0.95);
        }

        .transport-button:active,
        .bidcars-button:active,
        .caucasusContainerTracking-button:active {
            transform: scale(0.99);
        }

        .transport-logo,
        .caucasusContainerTracking-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: contain;
            transform: translateX(12px) scale(1.5);
            transform-origin: center;
        }

        .bidcars-logo {
            width: 78px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 8px;
            object-fit: contain;
        }

        .transport-divider,
        .bidcars-divider,
        .caucasusContainerTracking-divider {
            width: 2px;
            height: 42px;
            flex-shrink: 0;
            margin: 0 12px;
            background: #d9e0e9;
        }

        .transport-text,
        .caucasusContainerTracking-text {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.15;
            transform: translateX(12px);
        }

        .transport-text span,
        .caucasusContainerTracking-text span {
            display: block;
        }

        .bidcars-text {
            flex: 1;
            min-width: 0;
            color: #172033;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }

        .transport-arrow,
        .bidcars-arrow,
        .caucasusContainerTracking-arrow {
            flex-shrink: 0;
            margin-left: 8px;
            color: #172033;
            font-size: 30px;
        }

        /* Preserve the original divider positioning */
        .transport-button .transport-divider,
        .caucasusContainerTracking-button .caucasusContainerTracking-divider {
            transform: translateX(30px);
        }

        /* =========================================
           TRANSPORTATION PRICE POPUP
        ========================================= */

        .access-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.28s ease,
                visibility 0.28s ease;
        }

        .access-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Small iOS-style alert view */
        .access-modal-content {
            position: relative;

            width: min(92%, 390px);
            height: min(540px, 82vh);

            background: #ffffff;
            border-radius: 26px;

            overflow: hidden;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.28),
                0 0 0 1px rgba(255, 255, 255, 0.65);

            transform: translateY(25px) scale(0.94);
            opacity: 0;

            transition:
                transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.28s ease;
        }

        .access-modal.active .access-modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .access-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.92);
            color: #172033;

            font-size: 27px;
            font-weight: 400;
            line-height: 1;

            cursor: pointer;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .access-modal-close:hover {
            background: #ffffff;
            transform: scale(1.06);
        }

        .access-modal-close:active {
            transform: scale(0.94);
        }

        .access-modal-close:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 2px;
        }

        .access-frame {
            display: block;

            width: 100%;
            height: 100%;

            border: none;
            background: #f5f6fa;
        }

        @media (max-width: 420px) {
            .brand-logo {
                width: 260px;
                max-width: 70%;
                margin-bottom: 55px;
            }

            .transport-button,
            .bidcars-button,
            .caucasusContainerTracking-button {
                width: 72%;
            }

            .transport-button {
                padding: 6px 10px;
            }

            .transport-logo,
            .caucasusContainerTracking-logo {
                width: 48px;
                height: 48px;
            }

            .transport-divider,
            .bidcars-divider,
            .caucasusContainerTracking-divider {
                margin: 0 10px;
            }

            .transport-text,
            .caucasusContainerTracking-text {
                font-size: 15px;
            }

            .bidcars-logo {
                width: 72px;
                height: 46px;
            }

            .bidcars-text {
                font-size: 17px;
            }

            .transport-arrow,
            .bidcars-arrow,
            .caucasusContainerTracking-arrow {
                margin-left: 6px;
                font-size: 30px;
            }

            .transport-button .transport-divider,
            .caucasusContainerTracking-button .caucasusContainerTracking-divider {
                transform: translateX(24px);
            }

            .access-modal {
                padding: 10px;
            }

            .access-modal-content {
                width: min(92%, 380px);
                height: min(540px, 82vh);
                border-radius: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .access-modal,
            .access-modal-content {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <!-- Pulse AutoImport logo -->
    <img
        class="brand-logo"
        src="./pulseAutoImport-logo.PNG"
        alt="Pulse AutoImport"
    >

    <div class="buttons">
        <!-- Transportation Price -->
        <button
            class="transport-button"
            type="button"
            id="transportButton"
        >
            <img
                class="transport-logo"
                src="./auctions-logo.jpeg"
                alt="Caucasus Auto Import"
            >

            <div class="transport-divider"></div>

            <div class="transport-text">
                <span>Transportation</span>
                <span>Price</span>
            </div>

            <div class="transport-arrow">›</div>
        </button>

        <!-- BidCars -->
        <a
            class="bidcars-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="bidcars-logo"
                src="./bidcars-logo.jpeg"
                alt="BidCars"
            >

            <div class="bidcars-divider"></div>

            <div class="bidcars-text">
                BidCars
            </div>

            <div class="bidcars-arrow">›</div>
        </a>

        <!-- Container Tracking -->
        <a
            class="caucasusContainerTracking-button"
            href="https://caucasusauto.com/en/services/container-tracking"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="caucasusContainerTracking-logo"
                src="./caucasus-logo.jpeg"
                alt="Container Tracking"
            >

            <div class="caucasusContainerTracking-divider"></div>

            <div class="caucasusContainerTracking-text">
                <span>Container</span>
                <span>Tracking</span>
            </div>

            <div class="caucasusContainerTracking-arrow">›</div>
        </a>
    </div>

    <!-- Transportation Price Access Popup -->
    <div
        class="access-modal"
        id="accessModal"
        role="dialog"
        aria-modal="true"
        aria-label="Transportation Price Access"
        aria-hidden="true"
    >
        <div class="access-modal-content">
            <button
                class="access-modal-close"
                id="accessModalClose"
                type="button"
                aria-label="Close access window"
            >
                ×
            </button>

            <iframe
                class="access-frame"
                id="accessFrame"
                src="about:blank"
                title="Transportation Price Access"
            ></iframe>
        </div>
    </div>

    <script>
        const transportButton = document.getElementById("transportButton");
        const accessModal = document.getElementById("accessModal");
        const accessModalClose = document.getElementById("accessModalClose");
        const accessFrame = document.getElementById("accessFrame");

        let lastFocusedElement = null;

        function openAccessModal(event) {
            event.preventDefault();

            lastFocusedElement = document.activeElement;

            // Load access.html inside the popup.
            if (accessFrame.getAttribute("src") === "about:blank") {
                accessFrame.src = "./access.html?popup=1";
            }

            accessModal.classList.add("active");
            accessModal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");

            accessModalClose.focus();
        }

        function closeAccessModal() {
            accessModal.classList.remove("active");
            accessModal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");

            if (lastFocusedElement) {
                lastFocusedElement.focus();
            }
        }

        transportButton.addEventListener("click", openAccessModal);

        accessModalClose.addEventListener("click", closeAccessModal);

        // Close by clicking the darkened background.
        accessModal.addEventListener("click", function(event) {
            if (event.target === accessModal) {
                closeAccessModal();
            }
        });

        // Close with the Escape key.
        document.addEventListener("keydown", function(event) {
            if (
                event.key === "Escape" &&
                accessModal.classList.contains("active")
            ) {
                closeAccessModal();
            }
        });
    </script>
</body>
</html>
