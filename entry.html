<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse AutoImport</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 20px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 46%;
            max-width: 360px;
            min-width: 220px;
            height: 64px;

            border-radius: 22px;
            background: #2864e8;
            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;

            transition: background 0.15s ease;
        }

        .tool-button:hover {
            background: #1d4ed8;
        }

        .tool-button:active,
        .tool-button:focus {
            outline: none;
        }

        /* Transportation Price button */
        .transport-button {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;

            width: 72%;
            max-width: 360px;
            min-width: 0;
            height: 64px;

            padding: 6px 10px;
            border-radius: 22px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                6px 6px 16px rgba(35, 55, 85, 0.10),
                -4px -4px 12px rgba(255, 255, 255, 0.95);

            overflow: hidden;
        }

        .transport-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: contain;
        }

        .transport-divider {
            width: 2px;
            height: 42px;
            margin: 0 12px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .transport-text {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.15;
        }

        .transport-text span {
            display: block;
        }

        .transport-arrow {
            margin-left: 8px;
            flex-shrink: 0;
            font-size: 30px;
            color: #172033;
        }

        /* BidCars button */
        .bidcars-button {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;

            width: 72%;
            max-width: 360px;
            height: 64px;

            padding: 6px 10px;
            border-radius: 22px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                6px 6px 16px rgba(35, 55, 85, 0.10),
                -4px -4px 12px rgba(255, 255, 255, 0.95);

            overflow: hidden;
        }

        .bidcars-logo {
            width: 104px;
            height: 48px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .bidcars-divider {
            width: 2px;
            height: 42px;
            margin: 0 12px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .bidcars-text {
            flex: 1;
            min-width: 0;

            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        .bidcars-arrow {
            margin-left: 8px;
            flex-shrink: 0;
            font-size: 30px;
            color: #172033;
        }

        /* SeaRates button */
        .searates-button {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;

            width: 72%;
            max-width: 360px;
            height: 64px;

            padding: 6px 10px;
            border-radius: 22px;

            background: #ffffff;
            color: #172033;
            text-decoration: none;

            box-shadow:
                6px 6px 16px rgba(35, 55, 85, 0.10),
                -4px -4px 12px rgba(255, 255, 255, 0.95);

            overflow: hidden;
        }

        .searates-logo {
            width: 104px;
            height: 48px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .searates-divider {
            width: 2px;
            height: 42px;
            margin: 0 12px;
            flex-shrink: 0;
            background: #d9e0e9;
        }

        .searates-text {
            flex: 1;
            min-width: 0;

            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        .searates-arrow {
            margin-left: 8px;
            flex-shrink: 0;
            font-size: 30px;
            color: #172033;
        }

        @media (max-width: 420px) {
            .tool-button {
                width: 72%;
                min-width: 0;
            }

            .transport-button,
            .bidcars-button,
            .searates-button {
                width: 72%;
                height: 64px;
                padding: 6px 10px;
            }

            .transport-logo {
                width: 48px;
                height: 48px;
            }

            .transport-divider {
                height: 42px;
                margin: 0 10px;
            }

            .transport-text {
                font-size: 15px;
            }

            .transport-arrow {
                font-size: 30px;
                margin-left: 6px;
            }

            .bidcars-logo,
            .searates-logo {
                width: 104px;
                height: 48px;
            }

            .bidcars-divider,
            .searates-divider {
                height: 42px;
                margin: 0 10px;
            }

            .bidcars-text,
            .searates-text {
                font-size: 18px;
            }

            .bidcars-arrow,
            .searates-arrow {
                font-size: 30px;
                margin-left: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="buttons">

        <!-- Transportation Price -->
        <a class="transport-button" href="transportationPrice.html">
            <img
                class="transport-logo"
                src="caucasus-logo.jpeg"
                alt="Caucasus Auto Import"
            >

            <div class="transport-divider"></div>

            <div class="transport-text">
                <span>Transportation</span>
                <span>Price</span>
            </div>

            <div class="transport-arrow">›</div>
        </a>

        <!-- BidCars -->
        <a
            class="bidcars-button"
            href="https://bid.cars/en/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="bidcars-logo"
                src="bidcars-logo.jpeg"
                alt="BidCars"
            >

            <div class="bidcars-divider"></div>

            <div class="bidcars-text">
                BidCars
            </div>

            <div class="bidcars-arrow">›</div>
        </a>

        <!-- SeaRates -->
        <a
            class="searates-button"
            href="https://www.searates.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="searates-logo"
                src="searates-logo.jpeg"
                alt="SeaRates"
            >

            <div class="searates-divider"></div>

            <div class="searates-text">
                SeaRates
            </div>

            <div class="searates-arrow">›</div>
        </a>

    </div>

</body>
</html>
