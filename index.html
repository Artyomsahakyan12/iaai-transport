<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172033">

<title>Transportation Fees</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #172033;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin: 20px 0 28px;
    font-size: 28px;
}

.search-box {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: 1px solid #ccd2da;
    border-radius: 12px;
    outline: none;
    background: white;
}

.search-box:focus {
    border-color: #172033;
}

.label {
    margin-top: 24px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
}

#result {
    background: white;
    border-radius: 12px;
    padding: 16px;
    min-height: 55px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.message {
    color: #6b7280;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #e5e7eb;
    font-size: 17px;
}

.result-item:last-child {
    border-bottom: none;
}

.price {
    font-weight: 700;
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="container">

    <h1>Transportation Fees</h1>

    <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="Search location..."
        autocomplete="off"
        autocapitalize="words"
    >

    <div class="label">Result</div>

    <div id="result" class="message">
        location based fees..
    </div>

</div>

<script>

const database = [
    { name: "East Bay", price: 1850 },
    { name: "East Coast", price: 1950 },
    { name: "East Providence", price: 2050 },
    { name: "Portland - Gorham", price: 2020 },
    { name: "Rosedale", price: 1790 },
    { name: "Rental Rides", price: 2100 },
    { name: "Baltimore", price: 1650 },
    { name: "Chicago South", price: 2350 },
    { name: "Dallas", price: 2250 },
    { name: "Houston", price: 2250 }
];

const searchInput = document.getElementById("searchInput");
const result = document.getElementById("result");

function doSearch() {

    const query = searchInput.value.trim().toLowerCase();

    if (query === "") {
        result.innerHTML = "location based fees..";
        result.className = "message";
        return;
    }

    const found = database.filter(item =>
        item.name.toLowerCase().startsWith(query)
    );

    if (found.length === 0) {
        result.innerHTML = "No results found.";
        result.className = "message";
        return;
    }

    result.className = "";

    result.innerHTML = found.map(item => `
        <div class="result-item">
            <span>${item.name}</span>
            <span class="price">$${item.price.toLocaleString()}</span>
        </div>
    `).join("");
}

searchInput.addEventListener("input", doSearch);

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        doSearch();
    }
});

</script>

</body>
</html>
