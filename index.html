<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAAI Transport</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    color: #172033;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.wrap {
    max-width: 700px;
    margin: auto;
    padding: 55px 18px;
}

.brand {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .14em;
    color: #697386;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin: 10px 0 8px;
}

.sub {
    text-align: center;
    color: #7d8695;
    margin-bottom: 28px;
}

.search {
    background: white;
    border: 1px solid #dce2eb;
    border-radius: 17px;
    padding: 5px;
    display: flex;
    align-items: center;
    box-shadow: 0 8px 28px rgba(23,32,51,.07);
}

.icon {
    padding: 0 12px;
    color: #8a93a3;
    font-size: 22px;
}

input {
    flex: 1;
    border: 0;
    outline: 0;
    font-size: 18px;
    padding: 14px 6px;
    background: transparent;
}

button {
    width: 100%;
    margin-top: 12px;
    border: 0;
    border-radius: 15px;
    padding: 17px;
    background: #172033;
    color: white;
    font-size: 17px;
    font-weight: 750;
    cursor: pointer;
}

.label {
    margin-top: 28px;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 800;
    color: #7b8493;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.message,
.results {
    background: white;
    border: 1px solid #e0e5ed;
    border-radius: 17px;
}

.message {
    text-align: center;
    padding: 22px;
    color: #8992a1;
}

.row {
    padding: 18px 20px;
    border-bottom: 1px solid #edf0f4;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.row:last-child {
    border-bottom: 0;
}

.name {
    font-size: 17px;
    font-weight: 700;
}

.desc {
    font-size: 12px;
    color: #9299a6;
    margin-top: 4px;
}

.price {
    font-size: 23px;
    font-weight: 800;
}
</style>
</head>

<body>

<div class="wrap">

    <div class="brand">
        IAAI • TRANSPORT
    </div>

    <h1>
        Transportation Fee
    </h1>

    <div class="sub">
        Search a branch or location to find its transport price.
    </div>

    <div class="search">
        <div class="icon">⌕</div>

        <input
            id="searchInput"
            type="search"
            placeholder="Search location..."
            autocomplete="off"
            enterkeyhint="search"
        >
    </div>

    <button id="searchButton" type="button">
        Search
    </button>

    <div class="label">
        Result
    </div>

    <div id="result" class="message">
        Search result will appear here.
    </div>

</div>


<script>

const database = [

    {
        name: "East Bay",
        price: "$1,850"
    },

    {
        name: "East Coast",
        price: "$1,950"
    },

    {
        name: "East Providence",
        price: "$2,050"
    },

    {
        name: "Portland - Gorham",
        price: "$2,020"
    },

    {
        name: "Rosedale",
        price: "$1,790"
    },

    {
        name: "Rental Rides",
        price: "$2,100"
    },

    {
        name: "Baltimore",
        price: "$1,650"
    },

    {
        name: "Chicago South",
        price: "$2,350"
    },

    {
        name: "Dallas",
        price: "$2,250"
    },

    {
        name: "Houston",
        price: "$2,250"
    }

];


const searchInput = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");
const result = document.getElementById("result");


function doSearch() {

    const query =
        searchInput.value.trim().toLowerCase();


    if (!query) {

        result.className = "message";

        result.textContent =
            "Search result will appear here.";

        return;
    }


    const found =
        database.filter(function(item) {

            return item.name
                .toLowerCase()
                .startsWith(query);

        });


    if (found.length === 0) {

        result.className = "message";

        result.textContent =
            "No location found.";

        return;
    }


    result.className = "results";


    result.innerHTML =
        found.map(function(item) {

            return `
                <div class="row">

                    <div>

                        <div class="name">
                            ${item.name}
                        </div>

                        <div class="desc">
                            IAAI Transportation
                        </div>

                    </div>

                    <div class="price">
                        ${item.price}
                    </div>

                </div>
            `;

        }).join("");

}


/* LIVE SEARCH */

searchInput.addEventListener(
    "input",
    doSearch
);


/* SEARCH BUTTON */

searchButton.addEventListener(
    "click",
    doSearch
);


/* ENTER KEY */

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            doSearch();

        }

    }
);

</script>

</body>
</html>
